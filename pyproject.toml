[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-strategy-validator"
version = "0.1.0"
description = "Independent, fail-closed stock strategy research and Korean mobile dashboard"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
stock-validator = "stock_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_validator = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
