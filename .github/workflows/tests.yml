name: engine-and-platform-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation -e .
      - run: python -m pytest --junitxml=reports/tests.xml
      - run: python -m stock_validator certify --output reports/engine-certificate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: reports/
